            <section class="config-card config-page hidden" data-config-page="offDuty">
              <div class="section-head">
                <div>
                  <p class="section-eyebrow">下班监控</p>
                  <h2>下班监控配置</h2>
                </div>
                <button class="ghost-button" data-config-page-target="hub" type="button">返回目录</button>
              </div>
              <div class="config-grid">
                <label class="checkbox-field">
                  <span>启用下班监控</span>
                  <span class="checkbox-row">
                    <input id="offDutyAutomationEnabled" name="offDutyAutomationEnabled" type="checkbox" />
                    <em>启用中</em>
                  </span>
                </label>
                <label>
                  <span>下班检查间隔(ms，默认5分钟)</span>
                  <input id="offDutyScanIntervalMs" name="offDutyScanIntervalMs" inputmode="numeric" />
                </label>
                <label>
                  <span>售前早班上班时间</span>
                  <input id="offDutyPreSalesEarlyStartTime" name="offDutyPreSalesEarlyStartTime" placeholder="08:00" />
                </label>
                <label>
                  <span>售前晚班上班时间</span>
                  <input id="offDutyPreSalesLateStartTime" name="offDutyPreSalesLateStartTime" placeholder="15:45" />
                </label>
                <label>
                  <span>售后早班上班时间</span>
                  <input id="offDutyAfterSalesEarlyStartTime" name="offDutyAfterSalesEarlyStartTime" placeholder="08:00" />
                </label>
                <label>
                  <span>售后晚班上班时间</span>
                  <input id="offDutyAfterSalesLateStartTime" name="offDutyAfterSalesLateStartTime" placeholder="14:00" />
                </label>
                <label>
                  <span>售前早班关闭时间</span>
                  <input id="offDutyPreSalesEarlyCloseTime" name="offDutyPreSalesEarlyCloseTime" placeholder="16:30" />
                </label>
                <label>
                  <span>售前晚班关闭时间</span>
                  <input id="offDutyPreSalesLateCloseTime" name="offDutyPreSalesLateCloseTime" placeholder="23:45" />
                </label>
                <label>
                  <span>售后早班关闭时间</span>
                  <input id="offDutyAfterSalesEarlyCloseTime" name="offDutyAfterSalesEarlyCloseTime" placeholder="16:30" />
                </label>
                <label>
                  <span>售后晚班关闭时间</span>
                  <input id="offDutyAfterSalesLateCloseTime" name="offDutyAfterSalesLateCloseTime" placeholder="22:30" />
                </label>
                <label class="checkbox-field">
                  <span>群里提醒明天班次</span>
                  <span class="checkbox-row">
                    <input id="offDutyTomorrowShiftNotificationEnabled" name="offDutyTomorrowShiftNotificationEnabled" type="checkbox" />
                    <em>已关闭</em>
                  </span>
                </label>
                <button class="save-button" type="submit">保存下班监控配置</button>
              </div>
              <div class="feedback-banner is-info" data-shared-config-feedback aria-live="polite">
                <span class="feedback-banner-badge">配置反馈</span>
                <strong class="feedback-banner-title" data-feedback-title>等待保存</strong>
                <p class="feedback-banner-message" data-feedback-message>这里会显示下班监控配置保存结果。</p>
              </div>
            </section>
