# Temporary branch-only application of reviewed, hash-checked source edits.
# Removed through the connector after successful application; never runs on main or PRs.
name: Apply and validate project 9 refactor
on:
  push:
    branches: [refactor/9-hybrid-headless]
    paths:
      - '.github/project9*-updates.json'
      - '.github/workflows/project9-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/refactor/9-hybrid-headless' && github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only project 9 edits and verify content hashes
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess
          def blob(content):
              return hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          for manifest in ['.github/project9-updates.json', '.github/project9-extra-updates.json']:
              data = json.loads(pathlib.Path(manifest).read_text(encoding='utf-8'))
              subprocess.run(['git', 'merge-base', '--is-ancestor', data['base'], 'HEAD'], check=True)
              for item in data['files']:
                  name = item['path']
                  parts = pathlib.PurePosixPath(name).parts
                  assert parts[0] == '9.客服数据自动更新' and '..' not in parts and '\\' not in name
                  source = subprocess.check_output(['git', 'show', ':' + name]).replace(b'\r\n', b'\n')
                  assert blob(source) == item['before'], 'Unexpected base content: ' + name
                  lines = source.decode('utf-8').splitlines(keepends=True)
                  for start, end, text in reversed(item['edits']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end] = text.splitlines(keepends=True)
                  output = ''.join(lines).encode('utf-8')
                  assert blob(output) == item['after'], 'Unexpected result content: ' + name
                  pathlib.Path(name).write_bytes(output)
                  subprocess.run(['git', 'add', '--', name], check=True)
                  staged = subprocess.check_output(['git', 'rev-parse', ':' + name]).decode().strip()
                  assert staged == item['after'], 'Unexpected staged content: ' + name
              print('Verified and staged', len(data['files']), 'source edits; no runtime files staged')
      - name: Install locked dependencies
        working-directory: 9.客服数据自动更新
        run: npm ci
      - name: Run original regression and new unit tests
        working-directory: 9.客服数据自动更新
        run: npm test
      - name: Run real Chrome synthetic-page integration tests
        working-directory: 9.客服数据自动更新
        run: npm run test:browser
      - name: Commit tested source to development branch only
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/refactor/9-hybrid-headless
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(9): hybrid headless collection with guarded human handoff and popup handling'
          git push origin HEAD:refs/heads/refactor/9-hybrid-headless
      - name: Archive public dependencies for local regression checks
        if: always()
        shell: bash
        working-directory: 9.客服数据自动更新
        run: |
          if test -d node_modules; then tar -cf ../project9-dependencies.tar node_modules; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project9-public-dependencies
          path: project9-dependencies.tar
          retention-days: 3
